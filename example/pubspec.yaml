name: puck_example
description: A playground for the puck Flutter package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  liquid_glass_renderer: ^1.0.0-dev.2
  liquid_glass_widgets: ^1.17.3
  puck:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/performance/
    - assets/performance/results/latest.json
    - assets/avatars/
